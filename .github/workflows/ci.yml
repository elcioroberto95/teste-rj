name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            api/package-lock.json
            ui/package-lock.json

      - name: Instalar API
        run: npm ci
        working-directory: api

      - name: Instalar UI
        run: npm ci
        working-directory: ui

      - name: ESLint API
        run: npm run lint
        working-directory: api

      - name: Gerar Prisma Client
        run: npm run db:generate
        working-directory: api
        env:
          DATABASE_URL: mysql://corridas:desenvolvimento@localhost:3306/corridas

      - name: Build worker
        run: npm run build:worker
        working-directory: api

      - name: Testes unitários
        run: npm test
        working-directory: api

      - name: Build API
        run: npm run build
        working-directory: api

      - name: ESLint UI
        run: npm run lint
        working-directory: ui

      - name: Build UI
        run: npm run build
        working-directory: ui

      - name: Validar Docker Compose
        run: docker compose config --quiet

      - name: Construir imagens API e UI
        run: docker compose build api worker ui
