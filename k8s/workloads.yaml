apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels: { app: mysql }
  template:
    metadata:
      labels: { app: mysql }
    spec:
      containers:
        - name: mysql
          image: mysql:8.4.11
          ports:
            - { name: mysql, containerPort: 3306 }
          env:
            - { name: MYSQL_DATABASE, value: corridas }
            - { name: MYSQL_USER, value: corridas }
            - name: MYSQL_PASSWORD
              valueFrom: { secretKeyRef: { name: corridas-runtime, key: MYSQL_PASSWORD } }
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: corridas-runtime, key: MYSQL_ROOT_PASSWORD } }
          startupProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"] }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p$MYSQL_ROOT_PASSWORD --silent"] }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/mysql }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: mysql-data } }
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector: { app: mysql }
  ports: [{ name: mysql, port: 3306, targetPort: mysql }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:4.2.9-management
          command: ["sh", "-c", "rabbitmq-plugins enable rabbitmq_prometheus && rabbitmq-server"]
          ports:
            - { name: amqp, containerPort: 5672 }
            - { name: management, containerPort: 15672 }
            - { name: metrics, containerPort: 15692 }
          env:
            - { name: RABBITMQ_DEFAULT_USER, value: corridas }
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom: { secretKeyRef: { name: corridas-runtime, key: RABBITMQ_PASSWORD } }
          startupProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            periodSeconds: 10
          livenessProbe:
            exec: { command: ["rabbitmq-diagnostics", "-q", "ping"] }
            initialDelaySeconds: 45
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 768Mi }
          volumeMounts:
            - { name: data, mountPath: /var/lib/rabbitmq }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: rabbitmq-data } }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: amqp }
    - { name: management, port: 15672, targetPort: management }
    - { name: metrics, port: 15692, targetPort: metrics }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
spec:
  replicas: 1
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:8.0.32-noble
          ports: [{ name: mongo, containerPort: 27017 }]
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, value: root }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: corridas-runtime, key: MONGO_ROOT_PASSWORD } }
          startupProbe:
            exec:
              command: ["sh", "-c", "mongosh --quiet --username root --password \"$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping: 1}).ok' localhost:27017/admin"]
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["sh", "-c", "mongosh --quiet --username root --password \"$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping: 1}).ok' localhost:27017/admin"]
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mongosh --quiet --username root --password \"$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval 'db.adminCommand({ping: 1}).ok' localhost:27017/admin"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 768Mi }
          volumeMounts:
            - { name: data, mountPath: /data/db }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: mongo-data } }
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
spec:
  selector: { app: mongo }
  ports: [{ name: mongo, port: 27017, targetPort: mongo }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  replicas: 1
  selector:
    matchLabels: { app: redis }
  template:
    metadata:
      labels: { app: redis }
    spec:
      containers:
        - name: redis
          image: redis:8.4.7-alpine
          command: ["redis-server", "--appendonly", "yes"]
          ports: [{ name: redis, containerPort: 6379 }]
          startupProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            exec: { command: ["redis-cli", "ping"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["redis-cli", "ping"] }
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: redis-data } }
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: { app: redis }
  ports: [{ name: redis, port: 6379, targetPort: redis }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
spec:
  replicas: 1
  selector:
    matchLabels: { app: jaeger }
  template:
    metadata:
      labels: { app: jaeger }
    spec:
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.76.0
          ports:
            - { name: ui, containerPort: 16686 }
            - { name: otlp-http, containerPort: 4318 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
spec:
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: ui }
    - { name: otlp-http, port: 4318, targetPort: otlp-http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v3.15.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus"]
          ports: [{ name: http, containerPort: 9090 }]
          readinessProbe:
            httpGet: { path: /-/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 1Gi }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus, readOnly: true }
      volumes:
        - name: config
          configMap: { name: prometheus-config }
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  selector: { app: prometheus }
  ports: [{ name: http, port: 9090, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector:
    matchLabels: { app: api }
  template:
    metadata:
      labels: { app: api }
    spec:
      containers:
        - name: api
          image: corridas-api:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: corridas-config }
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: corridas-runtime, key: DATABASE_URL } } }
            - { name: REDIS_URL, valueFrom: { secretKeyRef: { name: corridas-runtime, key: REDIS_URL } } }
            - { name: NODE_OPTIONS, value: "--require @opentelemetry/auto-instrumentations-node/register" }
            - { name: OTEL_SERVICE_NAME, value: corridas-api }
          startupProbe:
            httpGet: { path: /v1/health, port: http }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /v1/health, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /v1/health, port: http }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 750m, memory: 768Mi }
          volumeMounts:
            - { name: jwt-keys, mountPath: /run/keys, readOnly: true }
      volumes:
        - name: jwt-keys
          secret:
            secretName: corridas-jwt-keys
            items:
              - { key: public.pem, path: public.pem }
              - { key: private.pem, path: private.pem }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector: { app: api }
  ports: [{ name: http, port: 3000, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker }
  template:
    metadata:
      labels: { app: worker }
    spec:
      containers:
        - name: worker
          image: corridas-worker:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: metrics, containerPort: 3002 }]
          envFrom:
            - configMapRef: { name: corridas-config }
          env:
            - { name: DATABASE_URL, valueFrom: { secretKeyRef: { name: corridas-runtime, key: DATABASE_URL } } }
            - { name: RABBITMQ_URL, valueFrom: { secretKeyRef: { name: corridas-runtime, key: RABBITMQ_URL } } }
            - { name: MONGODB_URL, valueFrom: { secretKeyRef: { name: corridas-runtime, key: MONGODB_URL } } }
            - { name: REDIS_URL, valueFrom: { secretKeyRef: { name: corridas-runtime, key: REDIS_URL } } }
            - { name: NODE_OPTIONS, value: "--require @opentelemetry/auto-instrumentations-node/register" }
            - { name: OTEL_SERVICE_NAME, value: corridas-worker }
          startupProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health, port: metrics }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: metrics }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 750m, memory: 768Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: worker
spec:
  selector: { app: worker }
  ports: [{ name: metrics, port: 3002, targetPort: metrics }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ui
spec:
  replicas: 1
  selector:
    matchLabels: { app: ui }
  template:
    metadata:
      labels: { app: ui }
    spec:
      containers:
        - name: ui
          image: corridas-ui:local
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 80 }]
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests: { cpu: 25m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: ui
spec:
  selector: { app: ui }
  ports: [{ name: http, port: 80, targetPort: http }]
