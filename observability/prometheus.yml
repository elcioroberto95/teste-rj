global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: corridas-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:3000"]
  - job_name: corridas-worker
    metrics_path: /metrics
    static_configs:
      - targets: ["worker:3002"]
  - job_name: rabbitmq
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]
