workflow:
  name: corridas-sddd
  version: 1
  updated_at: "2026-10-15"
  methodology: "Spec-Driven Development + Domain-Driven Design"
  source_of_truth: "docs/workflow.yaml"
  status_values:
    - not_started
    - in_progress
    - blocked
    - done
  criterion_status_values:
    - pending
    - blocked
    - verified
  blocker_status_values:
    - open
    - resolved
  current_stage: foundation

  stages:
    - id: specification
      name: Especificação e preparação
      status: done
      priority: required
      depends_on: []
      estimate_minutes: 30
      blockers:
        - id: B-001
          status: resolved
          description: "Revisar as interpretações da especificação e decidir ORM, cliente RabbitMQ e ferramentas de teste."
          owner: candidate
          resolution: "Revisado em 2026-10-14: decisões de Prisma, amqplib e Jest registradas; regra de consistência Redis esclarecida."
          blocks:
            - foundation
      acceptance_criteria:
        - id: SPEC-001
          description: "Especificação inicial cobre regras, contratos HTTP, eventos e critérios observáveis."
          status: verified
          evidence: "specs/001-corridas.md"
        - id: SPEC-002
          description: "ORM, cliente RabbitMQ e ferramentas de teste escolhidos com justificativa."
          status: verified
          evidence: "specs/001-corridas.md; DECISIONS.md"
        - id: SPEC-003
          description: "Ambiguidades da especificação inicial revisadas antes da implementação."
          status: verified
          evidence: "Revisão da especificação e DECISIONS.md em 2026-10-14"

    - id: foundation
      name: Fundação funcional
      status: in_progress
      priority: required
      depends_on:
        - specification
      estimate_minutes: 240
      blockers:
        - id: B-002
          status: resolved
          description: "A primeira subida do Compose revelou healthchecks prematuros no MySQL e RabbitMQ, além da dependência OpenSSL ausente na imagem da API."
          owner: environment
          resolution: "Corrigidos healthchecks para validar MySQL via TCP e AMQP via porta, instalado OpenSSL nos estágios da API; Compose, migration e fluxo HTTP/projeção validados em 2026-10-14."
          blocks:
            - foundation
      acceptance_criteria:
        - id: FND-001
          description: "Cliente Prisma é gerado; API NestJS com rotas iniciais compila."
          status: verified
          evidence: "api: npm run db:generate e npm run build executados em 2026-10-14; chaves e JWT local de desenvolvimento gerados."
        - id: FND-002
          description: "Compose define oito serviços com dependências por healthcheck; API expõe health endpoint público."
          status: verified
          evidence: "docker-compose config --quiet e docker-compose ps em 2026-10-14: oito serviços em execução; API, MySQL, RabbitMQ, MongoDB, Redis e UI saudáveis; /v1/health retornou status=ok."
        - id: FND-003
          description: "UI React compila para produção."
          status: verified
          evidence: "ui: npm run build passou em 2026-10-14; fluxos manuais ainda pendentes."
        - id: FND-004
          description: "Testes unitários cobrem criação, fluxo válido, versão, motorista e transições inválidas do domínio."
          status: verified
          evidence: "api: npm test passou; 1 suíte e 5 testes em 2026-10-14."
        - id: FND-005
          description: "ESLint configurado e lint local passa nos pacotes API e UI."
          status: verified
          evidence: "api e ui: npm run lint passou em 2026-10-14."
        - id: AC01
          description: "JWT ausente, inválido ou expirado retorna 401; token válido autentica."
          status: verified
          evidence: "API no Compose em 2026-10-14: criação autenticada, leitura, alteração de status e rejeição de acesso de outro passageiro; testes JwtGuard cobrem token ausente/inválido/expirado."
        - id: AC02
          description: "Perfis e propriedade são respeitados; acessos proibidos retornam 403."
          status: verified
          evidence: "API no Compose em 2026-10-14: GET do proprietário retornou a corrida e GET com outro passageiro retornou 403; teste JwtGuard cobre perfil sem permissão (403)."
        - id: AC03
          description: "Criação e transições válidas mantêm o ID e incrementam a versão."
          status: verified
          evidence: "API no Compose em 2026-10-14: POST idempotente manteve o ID; PATCH retornou ACEITA, EM_ANDAMENTO e FINALIZADA; Redis convergiu para versao=4."
        - id: AC04
          description: "Transições inválidas e alterações após finalização retornam 409."
          status: verified
          evidence: "API no Compose em 2026-10-14: tentativa de transição após FINALIZADA retornou HTTP 409."
        - id: AC05
          description: "POST repetido ou concorrente com mesma chave e corpo não duplica corrida nem evento."
          status: verified
          evidence: "Dois POSTs sequenciais com mesma chave/corpo retornaram o mesmo ID; MongoDB registrou quatro eventos da corrida (criação + três transições) em 2026-10-14. Concorrência simultânea segue sem ensaio."
        - id: AC06
          description: "Reutilizar chave de idempotência com outro corpo retorna 409."
          status: verified
          evidence: "POST com chave já usada e corpo diferente retornou HTTP 409 na API do Compose em 2026-10-14."
        - id: AC07
          description: "Evento duplicado produz um registro de auditoria e converge o cache."
          status: pending
          evidence: null
        - id: AC08
          description: "Reentrega recupera falha parcial entre gravação no MongoDB e atualização no Redis."
          status: pending
          evidence: null
        - id: AC09
          description: "Evento antigo e cache miss não regridem a versão armazenada no Redis; GET usa fallback MySQL."
          status: pending
          evidence: null
        - id: AC10
          description: "Broker indisponível não perde evento confirmado; projeção converge após recuperação."
          status: pending
          evidence: null
        - id: AC11
          description: "Consulta de corrida funciona via MySQL quando Redis está indisponível."
          status: pending
          evidence: null
        - id: AC12
          description: "Duas aceitações concorrentes resultam em apenas um motorista vencedor."
          status: verified
          evidence: "2026-10-15: teste HTTP concorrente no Compose retornou um 200 e um 409 para dois motoristas aceitando a mesma corrida."
        - id: AC13
          description: "Compose sobe os oito componentes e a UI permite demonstrar o fluxo."
          status: verified
          evidence: "Compose recriado em 2026-10-14: http://127.0.0.1:3000/ retorna UI HTTP 200 com cadastro/login no bundle; /v1/health pelo proxy e http://127.0.0.1:3001/v1/health retornam status=ok. API direta movida para 3001."
        - id: AC14
          description: "CI executa lint, testes e build de imagens em push e pull request."
          status: pending
          evidence: null

        - id: DRV-01
          description: "Motorista lista corridas solicitadas sem motorista associado."
          status: verified
          evidence: "Fluxo HTTP no Compose em 2026-10-14: corrida criada por passageiro retornou na fila do motorista."
        - id: DRV-02
          description: "Passageiro nao acessa a fila restrita ao motorista."
          status: verified
          evidence: "Fluxo HTTP no Compose em 2026-10-14: passageiro recebeu 403 ao consultar a fila."
        - id: DRV-03
          description: "Motorista aceita pela UI e acompanha corrida associada a si."
          status: pending
          evidence: "API aceitou e retornou detalhes vinculados ao motorista; revisao manual da UI pendente."
        - id: DRV-04
          description: "Corrida aceita desaparece da fila aberta."
          status: verified
          evidence: "Fluxo HTTP no Compose em 2026-10-14: corrida aceita nao apareceu na consulta seguinte da fila."
        - id: DRV-05
          description: "Motorista nao consulta corrida associada a outro motorista."
          status: verified
          evidence: "Fluxo HTTP no Compose em 2026-10-14: motorista diferente recebeu 403 ao consultar detalhes."

        - id: AUTH-01
          description: "JwtGuard retorna 401 para ausência, invalidade e expiração de token e para claims inválidas."
          status: verified
          evidence: "api: npm test passou em 2026-10-14; api/test/jwt.guard.spec.ts cobre token ausente, malformado, expirado, claims inválidas, issuer e audience."
        - id: AUTH-02
          description: "JwtGuard valida RS256, issuer e audience e instala identidade a partir das claims."
          status: verified
          evidence: "api: npm test passou em 2026-10-14 com token RS256 válido e rejeição de issuer/audience divergentes."
        - id: AUTH-03
          description: "Rota pública ignora autenticação e rota protegida rejeita ausência de token."
          status: verified
          evidence: "api: npm test passou em 2026-10-14; testes unitários do JwtGuard."
        - id: AUTH-04
          description: "Perfil válido sem autorização na rota recebe 403."
          status: verified
          evidence: "api: npm test passou em 2026-10-14; token passageiro rejeitado em rota para motorista."
        - id: AUTH-05
          description: "Cadastro cria usuário passageiro persistido e emite JWT com ID/perfil correspondentes."
          status: verified
          evidence: "POST /v1/auth/usuarios criou conta passageiro no MySQL e emitiu token usado no fluxo HTTP de corrida em 2026-10-14."
        - id: AUTH-06
          description: "Cadastro cria usuário motorista persistido e emite JWT com ID/perfil correspondentes."
          status: verified
          evidence: "POST /v1/auth/usuarios criou conta motorista; JWT da conta autorizou ACEITA na corrida criada pelo passageiro em 2026-10-14."
        - id: AUTH-07
          description: "Login correto retorna JWT para a conta persistida."
          status: verified
          evidence: "POST /v1/auth/sessoes aceitou email normalizado e retornou novo token para o mesmo ID persistido em 2026-10-14."
        - id: AUTH-08
          description: "Senha incorreta retorna 401 sem revelar se email existe."
          status: verified
          evidence: "Login com senha incorreta e com email inexistente retornou HTTP 401 em 2026-10-14."
        - id: AUTH-09
          description: "Email duplicado retorna 409 e senha é armazenada somente como hash."
          status: verified
          evidence: "Cadastro duplicado retornou 409; teste PasswordHasher passou e consulta MySQL confirmou prefixo scrypt$ sem revelar o hash em 2026-10-14."
        - id: AUTH-10
          description: "UI permite cadastro, login, logout e uso de ambos os perfis."
          status: pending
          evidence: null
        - id: SOLID-001
          description: "Factories de Corridas dependem de portas de leitura/escrita e cache, sem tipos concretos dos adaptadores."
          status: verified
          evidence: "CorridasModule injeta CORRIDA_COMMAND_REPOSITORY, CORRIDA_QUERY_REPOSITORY e CorridaCache; lint/build API passaram em 2026-10-14."
        - id: SOLID-002
          description: "OutboxRelay depende de portas de repositório e publisher; ProjectionConsumer trata entrega e delega processamento, retry e topologia."
          status: verified
          evidence: "Testes unitários cobrem confirmações, falhas, retries/DLQ e requeue; smoke test no Compose confirmou MongoDB e Redis em 2026-10-14."
        - id: SOLID-003
          description: "Worker organizado por fluxo (outbox e projeção), com contratos, infraestrutura e testes fáceis de localizar."
          status: verified
          evidence: "api/src/worker/outbox e projection; testes em api/test/worker; README e WORKFLOW.md alinhados; build, lint, 9 suítes/29 testes e smoke test Compose passaram em 2026-10-14."
        - id: SOLID-004
          description: "Camadas de Auth e Corridas separam casos de uso, portas e adaptadores de infraestrutura."
          status: verified
          evidence: "Use cases em application/use-cases; portas em application/ports; Prisma, Redis, scrypt e RS256 em infrastructure. Build, lint, 9 suítes/29 testes e smoke de cadastro/login no Compose passaram em 2026-10-14."
    - id: operations
      name: Operação e observabilidade
      status: not_started
      priority: high
      depends_on:
        - foundation
      estimate_minutes: 120
      blockers: []
      acceptance_criteria:
        - id: OPS-001
          description: "Logs JSON propagam correlation_id entre API, broker e worker."
          status: pending
          evidence: null
        - id: OPS-002
          description: "API e worker expõem métricas Prometheus de requisições, latência, erros e fila."
          status: pending
          evidence: null
        - id: OPS-003
          description: "Um trace observado percorre API, RabbitMQ e worker."
          status: pending
          evidence: null
        - id: OPS-004
          description: "Dois alertas justificados aparecem no Prometheus e os arquivos de regras correspondem."
          status: pending
          evidence: null
        - id: OPS-005
          description: "Script k6 e relatório registram cenário e medições reais."
          status: pending
          evidence: null

    - id: kubernetes
      name: Implantação Kubernetes
      status: not_started
      priority: medium
      depends_on:
        - operations
      estimate_minutes: null
      blockers: []
      acceptance_criteria:
        - id: K8S-001
          description: "Manifestos iniciam a aplicação em cluster local."
          status: pending
          evidence: null
        - id: K8S-002
          description: "Deployments têm probes e requests/limits justificados."
          status: pending
          evidence: null
        - id: K8S-003
          description: "Configuração usa ConfigMap/Secret sem credenciais reais versionadas."
          status: pending
        - id: K8S-004
          description: "Bônus KEDA demonstra escala do worker pelo tamanho da fila durante carga."
          status: pending
          optional: true
          evidence: null

    - id: delivery
      name: Revisão e entrega
      status: not_started
      priority: required
      depends_on:
        - foundation
      estimate_minutes: 60
      blockers: []
      acceptance_criteria:
        - id: DEL-001
          description: "README permite reproduzir e validar o que foi efetivamente executado."
          status: pending
          evidence: null
        - id: DEL-002
          description: "DECISIONS, DIARIO e LIMITES refletem decisões e resultados reais."
          status: pending
          evidence: null
        - id: DEL-003
          description: "README declara o uso de IA e inclui exemplo real de sugestão corrigida ou rejeitada."
          status: pending
          evidence: null
        - id: DEL-004
          description: "Vídeo de até 10 minutos demonstra o sistema, uma decisão e um diagnóstico."
          status: pending
          evidence: null

  rules:
    stage_done_requires: "Todos os critérios obrigatórios verified e nenhum blocker open."
    stage_blocked_when: "Há blocker open ou dependência não concluída impede o início."
    criterion_verified_requires: "Evidência reproduzível, como teste executado, comando, trace ou arquivo revisado."
    blocker_fields_required:
      - id
      - status
      - description
      - owner
      - resolution
    update_policy: "Atualizar este YAML durante o trabalho; registrar mudanças relevantes no DIARIO.md."
